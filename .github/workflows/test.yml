name: pytest

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Pythonのセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: ffmpegのインストール
        run: sudo apt-get install -y ffmpeg

      - name: 依存パッケージのインストール
        working-directory: backend
        run: pip install -r requirements.txt

      - name: pytestの実行
        working-directory: backend
        run: pytest tests/ -v
